# Build and publish scilaxy-relay server-side images to ghcr.io.
#
# Triggers:
#   - push to main           → push :main + :sha tags
#   - tag v*                 → push :sha + :v* + :latest tags
#   - workflow_dispatch      → manual run
#
# We deliberately publish under ghcr.io/scienceol/scilaxy-relay-* so
# any cluster (or any developer) can `docker pull` without auth — the
# repo itself is public. The k8s manifests pin to a specific :sha or
# :v* tag so a "latest" rolling deploy never happens by accident.
#
# What's NOT here: the desktop-side capturer (mac-capturer + capturer
# crates). Those compile only on macOS and ship inside the Scilaxy
# runner binary via the runner repo's own release pipeline.

name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/scienceol/scilaxy-relay

jobs:
  test:
    name: test (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        # mac-capturer / capturer-via-mac-capturer are macOS-only;
        # exclude them on the linux build so we don't fight
        # missing Apple frameworks.
        run: |
          cargo check --workspace \
            --exclude scilaxy-relay-mac-capturer \
            --exclude scilaxy-relay-capturer
      - name: cargo clippy (informational)
        # Run clippy purely for visibility — never gate the pipeline
        # on it. Real lint cleanup happens in standalone PRs once
        # the field_reassign + this-loop-never-loops cluster is
        # untangled.
        continue-on-error: true
        run: |
          cargo clippy --workspace \
            --exclude scilaxy-relay-mac-capturer \
            --exclude scilaxy-relay-capturer || true
      - name: cargo test
        run: |
          cargo test --workspace \
            --exclude scilaxy-relay-mac-capturer \
            --exclude scilaxy-relay-capturer

  build-and-push:
    name: build ${{ matrix.bin }}
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        bin: [stream, control, rendezvous, relay]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        # Required for cross-arch (arm64) builds on amd64 GitHub runners.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # `${{ github.actor }}` resolves to whoever pushed; for tag
          # builds that's the tagger. Token is the auto-issued
          # GITHUB_TOKEN — `permissions.packages: write` above grants
          # it ghcr push rights without any manual PAT.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="${IMAGE_PREFIX}-${{ matrix.bin }}"
          TAGS="${IMAGE}:sha-${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${IMAGE}:${VERSION},${IMAGE}:latest"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            TAGS="${TAGS},${IMAGE}:main"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Multi-arch: amd64 for k8s (sgk / shk amd64 nodes) + arm64 so
          # Apple Silicon devs can `docker pull` the same `:main` tag for
          # local `just dev` without hitting "no matching manifest".
          # arm64 is QEMU-emulated; cargo-chef GHA cache keeps incremental
          # builds reasonable.
          platforms: linux/amd64,linux/arm64
          build-args: |
            BIN=${{ matrix.bin }}
          tags: ${{ steps.tags.outputs.tags }}
          # GitHub-cache backend so the cargo-chef layer (the slow
          # one) survives across builds.
          cache-from: type=gha,scope=${{ matrix.bin }}
          cache-to: type=gha,scope=${{ matrix.bin }},mode=max
